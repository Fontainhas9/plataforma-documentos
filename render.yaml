# render.yaml - CORRIGIDO para HTML/CSS/JS
services:
  - type: web
    name: plataforma-documentos-backend
    runtime: python
    rootDir: .
    buildCommand: |
      pip install -r requirements.txt
      python -c "from backend.database import engine; from backend.models import Base; Base.metadata.create_all(bind=engine); print('✅ Tabelas criadas!')"
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: plataforma-documentos-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
    plan: free

  - type: web
    name: plataforma-documentos-frontend
    runtime: static
    rootDir: .
    buildCommand: |
      echo "📁 Static site - no build needed"
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /pages/login.html
    envVars:
      - key: API_URL
        value: https://plataforma-documentos-backend.onrender.com
    plan: free

databases:
  - name: plataforma-documentos-db
    plan: free
    databaseName: documentos
    user: app