<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document Platform - Login</title>

    <link rel="icon" type="image/png" href="../imagen/logo-holoss.png" />
    <link rel="stylesheet" href="../css/login.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- ✅ 1º: AUTH - BLOQUEIA A PÁGINA SE JÁ ESTIVER LOGADO -->
    <script src="../js/auth.js"></script>
</head>
<body>
    <main class="login-page">
        <section class="login-container">
            <div class="login-box">
                <div class="login-box__brand">
                    <img src="../imagen/logo-holoss.png" alt="Holoss logo" class="login-box__logo" />
                    <div class="login-box__brand-text">
                        <h2>Document Platform</h2>
                        <p>Sign in to continue</p>
                    </div>
                </div>

                <form id="loginForm" class="login-form" novalidate>
                    <div class="input-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" placeholder="Enter your username" required />
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter your password" required />
                    </div>

                    <button type="submit" id="loginButton">Log in</button>
                </form>

                <p id="errorMsg" class="error" aria-live="polite"></p>
            </div>
        </section>
    </main>

    <!-- ✅ 2º: OUTROS SCRIPTS -->
    <script src="../js/config.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
